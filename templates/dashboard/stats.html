{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Statistiques</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body class="container mt-5">
    <h1>Statistiques des jeux moissonnés</h1>
    <p>Total : {{ total }}</p>
    <ul>
        {% for item in by_source %}
            <li>{{ item.source }} : {{ item.count }}</li>
        {% endfor %}
    </ul>
</body>
</html>
